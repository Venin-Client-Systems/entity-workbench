[package]
name = "workbench-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rust_decimal = { version = "1", features = ["serde-str"] }
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "time", "sync"] }
scraper = "0.24"
html5ever = "=0.35.0"
robotstxt = "0.3"

tempfile = "3"
quick-xml = "=0.42.0"
zip = { version = "=8.6.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
workbench-windows-worker = { path = "../windows-worker" }
rusqlite = { version = "0.37", features = ["hooks"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
workbench-windows-worker = { path = "../windows-worker" }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
