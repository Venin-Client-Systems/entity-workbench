[package]
name = "entity-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
# Explicit development build only; no runtime environment or frontend switch.
development-graph-runtime = []
# Isolated startup-only proof. Refuses ordinary identifiers and existing app data.
development-graph-startup-proof = ["development-graph-runtime"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
workbench-core = { path = "../crates/core" }
serde_json = "1"
