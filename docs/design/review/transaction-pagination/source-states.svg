<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1160" viewBox="0 0 920 1160">
<rect x="0" y="0" width="920" height="1160" fill="#f7f8f4"/>
<rect x="0" y="0" width="920" height="7" fill="#a64814"/>
<text x="28" y="37" font-family="JetBrains Mono" font-size="11" font-weight="600" fill="#a64814">TRANSACTIONS / PAGINATION STATES</text>
<text x="28" y="75" font-family="Inter" font-size="27" font-weight="650" fill="#202729">Freshness and page boundaries</text>
<text x="28" y="102" font-family="Inter" font-size="13" font-weight="400" fill="#4f5c60">Separate loading, stale, unavailable and zero-selection states</text>
<rect x="28" y="123" width="864" height="1" fill="#cbd0ca"/>
<text x="28" y="157" font-family="JetBrains Mono" font-size="11" font-weight="600" fill="#a64814">01 / REVISION CHANGED</text>
<rect x="28" y="177" width="864" height="191" fill="#fef3c7"/>
<rect x="28" y="177" width="4" height="191" fill="#a64814"/>
<text x="45" y="207" font-family="Inter" font-size="19" font-weight="600" fill="#202729">This page is stale</text>
<text x="45" y="235" font-family="JetBrains Mono" font-size="12" font-weight="600" fill="#202729">Page revision 84 · current workspace revision 85</text>
<text x="45" y="261" font-family="Inter" font-size="12" font-weight="400" fill="#4f5c60">Previously loaded rows remain marked stale. Review, navigation and export are unavailable.</text>
<text x="45" y="282" font-family="Inter" font-size="12" font-weight="400" fill="#4f5c60">Refresh starts at the first page and keeps the applied filters. Draft edits stay separate.</text>
<rect x="45" y="310" width="277" height="36" fill="#202729" stroke="#cbd0ca"/>
<text x="57" y="333" font-family="Inter" font-size="12" font-weight="600" fill="#f7f8f4">Refresh workspace · first page</text>
<text x="28" y="408" font-family="JetBrains Mono" font-size="11" font-weight="600" fill="#a64814">02 / NONEMPTY SCOPE, ZERO SELECTED</text>
<rect x="28" y="428" width="864" height="189" fill="#ffffff" stroke="#cbd0ca"/>
<text x="45" y="459" font-family="Inter" font-size="19" font-weight="600" fill="#202729">0 accepted rows selected</text>
<text x="45" y="487" font-family="JetBrains Mono" font-size="11" font-weight="500" fill="#202729">SCOPE 6 / ACCEPTED 0 / PENDING 6 / REJECTED 0 / DEFERRED 0</text>
<text x="45" y="515" font-family="Inter" font-size="12" font-weight="400" fill="#4f5c60">No rows match the applied accepted-only selection. Six pending rows remain in scope.</text>
<rect x="45" y="546" width="74" height="36" fill="#e7eae5" stroke="#cbd0ca"/>
<text x="57" y="569" font-family="Inter" font-size="12" font-weight="600" fill="#79817e">First</text>
<rect x="129" y="546" width="77" height="36" fill="#e7eae5" stroke="#cbd0ca"/>
<text x="141" y="569" font-family="Inter" font-size="12" font-weight="600" fill="#79817e">Back</text>
<rect x="216" y="546" width="77" height="36" fill="#e7eae5" stroke="#cbd0ca"/>
<text x="228" y="569" font-family="Inter" font-size="12" font-weight="600" fill="#79817e">Next</text>
<text x="318" y="570" font-family="Inter" font-size="12" font-weight="400" fill="#4f5c60">0 rows shown · no export available</text>
<text x="28" y="657" font-family="JetBrains Mono" font-size="11" font-weight="600" fill="#a64814">03 / SHORT PAGE WITH MORE ROWS</text>
<rect x="28" y="677" width="864" height="149" fill="#202729"/>
<text x="45" y="710" font-family="Inter" font-size="20" font-weight="600" fill="#f7f8f4">26–42 of 326 selected</text>
<text x="45" y="738" font-family="Inter" font-size="12" font-weight="400" fill="#d4dcd8">17 returned · up to 25 requested · more rows are available</text>
<text x="45" y="762" font-family="Inter" font-size="12" font-weight="400" fill="#d4dcd8">Page range uses returned rows. A short page does not mean the end of the selection.</text>
<rect x="705" y="775" width="77" height="36" fill="#f7f8f4" stroke="#cbd0ca"/>
<text x="717" y="798" font-family="Inter" font-size="12" font-weight="600" fill="#202729">Back</text>
<rect x="794" y="775" width="78" height="36" fill="#202729" stroke="#cbd0ca"/>
<text x="806" y="798" font-family="Inter" font-size="12" font-weight="600" fill="#f7f8f4">Next</text>
<text x="28" y="866" font-family="JetBrains Mono" font-size="11" font-weight="600" fill="#a64814">04 / UNAVAILABLE PAGE</text>
<rect x="28" y="886" width="864" height="167" fill="#ffffff" stroke="#cbd0ca"/>
<text x="45" y="918" font-family="Inter" font-size="19" font-weight="600" fill="#202729">Page could not be read</text>
<text x="45" y="946" font-family="Inter" font-size="12" font-weight="400" fill="#4f5c60">The cursor, revision or retained source could not be verified. No zero-result claim is made.</text>
<text x="45" y="968" font-family="Inter" font-size="12" font-weight="400" fill="#4f5c60">A failed read does not replace the page with cached rows from another query.</text>
<rect x="45" y="994" width="176" height="36" fill="#f7f8f4" stroke="#cbd0ca"/>
<text x="57" y="1017" font-family="Inter" font-size="12" font-weight="600" fill="#202729">Retry page read</text>
<rect x="233" y="994" width="176" height="36" fill="#f7f8f4" stroke="#cbd0ca"/>
<text x="245" y="1017" font-family="Inter" font-size="12" font-weight="600" fill="#202729">Restart first page</text>
<text x="28" y="1097" font-family="Inter" font-size="11" font-weight="400" fill="#4f5c60">COMPACT BEHAVIOR / fields and denominators stack; the ledger keeps a labelled scroll region.</text>
<text x="28" y="1132" font-family="JetBrains Mono" font-size="9" font-weight="500" fill="#a64814">ILLUSTRATIVE SYNTHETIC DESIGN / NO CHANGES TO CANONICAL CONTRACT V12</text>
</svg>
